[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shrap"
version = "0.1.0"
description = "Shrap — self-developing multi-agent trading firm"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Mike" }]
dependencies = [
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.7",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
health-monitor = ["pydantic-settings>=2.4"]
audit-logger = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
pre-trade-checker = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
execution-agent = ["pydantic-settings>=2.4"]
paper-order-store = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
reconciliation-agent = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
regime-classifier = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
decision-maker = ["pydantic-settings>=2.4"]
strategy-fixture = ["pydantic-settings>=2.4"]
strategy-librarian = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
tech-watcher = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
news-analyzer = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
filing-processor = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
market-phase = ["pydantic-settings>=2.4", "pandas-market-calendars>=4.4"]
universe-curator = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
market-data = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
strategy-evaluator = ["pydantic-settings>=2.4", "asyncpg>=0.29", "numpy>=1.26", "pandas>=2.2"]
strategy-runner = [
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
]
strategy-seed = ["asyncpg>=0.29"]
infra-mapper = ["pydantic-settings>=2.4", "asyncpg>=0.29"]
spine-smoke = ["asyncpg>=0.29"]

# Everything the test suite needs to import. Tests exercise agent modules
# directly, so `.[dev]` alone cannot collect them — 13 files failed on a clean
# environment before this existed, while a stale local venv reported green.
#
# Self-referential rather than a copied list of packages: version constraints
# live once, in the extra that owns them, and cannot drift. Adding a new agent
# extra means adding it here too; CI fails on collection if it is forgotten,
# which is the intended feedback.
test = [
    "shrap[health-monitor,audit-logger,pre-trade-checker,execution-agent]",
    "shrap[paper-order-store,reconciliation-agent,regime-classifier]",
    "shrap[decision-maker,strategy-fixture,strategy-librarian,tech-watcher]",
    "shrap[news-analyzer,filing-processor,market-phase,universe-curator]",
    "shrap[market-data,strategy-evaluator,strategy-runner,strategy-seed]",
    "shrap[infra-mapper,spine-smoke]",
]

[project.scripts]
shrap-health-monitor = "shrap.agents.operations.health_monitor.__main__:main"
shrap-audit-logger = "shrap.agents.operations.audit_logger.__main__:main"
shrap-pre-trade-checker = "shrap.agents.risk_compliance.pre_trade_checker.__main__:main"
shrap-execution-agent = "shrap.agents.trading_floor.execution_agent.__main__:main"
shrap-paper-order-store = "shrap.agents.trading_floor.paper_order_store.__main__:main"
shrap-reconciliation-agent = "shrap.agents.operations.reconciliation_agent.__main__:main"
shrap-spine-smoke = "shrap.trading_floor.spine_smoke_cli:main"
shrap-regime-classifier = "shrap.agents.intelligence.regime_classifier.__main__:main"
shrap-decision-maker = "shrap.agents.trading_floor.decision_maker.__main__:main"
shrap-strategy-fixture = "shrap.agents.research.strategy_fixture.__main__:main"
shrap-strategy-librarian = "shrap.agents.research.strategy_librarian.__main__:main"
shrap-tech-watcher = "shrap.agents.research.tech_watcher.__main__:main"
shrap-tech-watcher-review = "shrap.research.tech_watcher.review:main"
shrap-news-analyzer = "shrap.agents.intelligence.news_analyzer.__main__:main"
shrap-filing-processor = "shrap.agents.intelligence.filing_processor.__main__:main"
shrap-filing-processor-backfill = "shrap.agents.intelligence.filing_processor.backfill:main"
shrap-market-phase = "shrap.agents.operations.market_phase.__main__:main"
shrap-tech-watcher-promote = "shrap.research.tech_watcher.promotion:main"
shrap-world-changer-observe = "shrap.research.tech_watcher.observe_cli:main"
shrap-tech-watcher-refilter = "shrap.research.tech_watcher.refilter_cli:main"
shrap-literature-refilter = "shrap.research.tech_watcher.literature_refilter_cli:main"
shrap-universe-curator = "shrap.agents.research.universe_curator.__main__:main"
shrap-universe-promote = "shrap.research.universe_curator.cli:main"
shrap-market-data-backfill = "shrap.market_data.backfill:main"
shrap-strategy-evaluate = "shrap.research.strategy_evaluator.cli:main"
shrap-research-ledger = "shrap.research.ledger_cli:main"
shrap-hypothesis-generate = "shrap.research.hypothesis_generator.cli:main"
shrap-strategy-evaluator-trigger = "shrap.agents.research.strategy_evaluator.__main__:main"
shrap-strategy-runner = "shrap.agents.research.strategy_runner.__main__:main"
shrap-strategy-seed = "shrap.research.strategy_seed.cli:main"
shrap-strategy-stage = "shrap.research.strategy_stage_cli:main"
shrap-infra-mapper = "shrap.research.infra_mapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shrap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src/shrap"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*", "pandas.*"]
ignore_missing_imports = true
