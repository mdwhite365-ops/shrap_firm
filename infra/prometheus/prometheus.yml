# Prometheus scrape config for the shrap-prod substrate.
#
# Targets are reached over the shrap_net Docker bridge using service DNS,
# except node-exporter, which runs in host networking mode and is reached at
# host.docker.internal - resolved by the `extra_hosts: host-gateway` entry on
# the prometheus service in docker-compose.yml.
#
# This comment used to say "typically 172.17.0.1 on Linux" and to tell the
# reader to adjust it if their gateway differed. Nobody did, nothing checked,
# and node-exporter was never scraped once. A hostname Docker fills in cannot
# drift the way a hardcoded address did.
#
# ADR-0004: 30-day retention, single-host, Mike's daily surface is the
# briefing - Grafana is for incident drilling.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    host: shrap-prod
    env: prod

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    # node-exporter runs with network_mode: host, so it is reached through the
    # host rather than by service DNS. `host.docker.internal` comes from the
    # `extra_hosts: host-gateway` entry on the prometheus service, which lets
    # Docker supply this bridge's real gateway instead of the config asserting
    # one. Paired with the exporter binding 0.0.0.0 - a loopback bind is
    # unreachable from this container whatever address is named here.
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop noisy go runtime metrics emitted by cadvisor itself.
      - source_labels: [__name__]
        regex: "go_.*"
        action: drop
      # Drop process_* runtime metrics for the same reason.
      - source_labels: [__name__]
        regex: "process_.*"
        action: drop

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: qdrant
    # Qdrant exposes Prometheus metrics natively on its HTTP port.
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: docker-state-exporter
    # Container health and restart counts, read from the Docker API.
    #
    # cAdvisor cannot supply either. Verified 2026-09-18: `shraptasmaner` had
    # restarted 88,034 times and cAdvisor had NEVER seen it — it scraped 40
    # containers and that one was not among them, because a container that
    # fails instantly spends no measurable time running between restarts.
    # Prometheus-based crashloop detection was therefore not merely absent, it
    # was impossible. The Docker API is the only source that sees a container
    # which is almost never up.
    static_configs:
      - targets: ["docker-state-exporter:8080"]
    metric_relabel_configs:
      # The exporter copies every compose label onto every series. For 40
      # containers that is ~20 extra labels per sample, none of which any query
      # here uses; `name` is the identity we alert on.
      - regex: "container_label_.*"
        action: labeldrop
      - source_labels: [__name__]
        regex: "go_.*"
        action: drop
      - source_labels: [__name__]
        regex: "process_.*"
        action: drop
